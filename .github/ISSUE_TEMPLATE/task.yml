name: タスク
description: 実施することが決定した作業（機能追加・改善・ドキュメント等）
title: "[TASK] <簡単な概要>"
labels: []
body:
    - type: textarea
      id: background
      attributes:
          label: 背景
          description: なぜこのタスクが必要か
      validations:
          required: true
    - type: textarea
      id: deliverables
      attributes:
          label: 成果物・完了条件
          description: チェックリスト推奨
      validations:
          required: true
    - type: dropdown
      id: priority
      attributes:
          label: 優先度
          options:
              - "高"
              - "中"
              - "低"
      validations:
          required: false
    - type: textarea
      id: related
      attributes:
          label: 関連
          description: 関連 Issue・ドキュメント・コード箇所等
      validations:
          required: false
